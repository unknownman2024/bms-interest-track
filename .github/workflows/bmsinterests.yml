name: BMS Fetcher

on:
  schedule:
    - cron: "20 * * * *"   # Runs x minutes
  workflow_dispatch:

jobs:
  run-bms:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p "Bookmyshow Data"
          mkdir -p "Bookmyshow Data/logs"

      - name: Run script
        run: python3 bmsinterests.py

      - name: Stage updated JSON files
        run: |
          git add -f "Bookmyshow Data" || true
          
      - name: Commit files
        run: |
          IST_TIME=$(TZ="Asia/Kolkata" date "+%d-%m-%Y %I:%M:%S %p")
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git commit -m "Auto-update: $IST_TIME" || echo "No changes to commit"

      - name: Push changes
        run: git push
